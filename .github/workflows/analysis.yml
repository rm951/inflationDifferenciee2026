name: Reproduce analysis

on:
  push:
  pull_request:

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: cd data/raw && sha256sum -c SHA256SUMS
      - run: python src/analyse.py
      - run: python -m unittest discover -s tests -v
      # Les PNG peuvent varier selon les bibliotheques de polices du runner.
      # Les tableaux numeriques, eux, doivent etre strictement reproductibles.
      - run: git diff --exit-code -- outputs/tables
